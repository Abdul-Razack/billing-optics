<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Billing Optics ERP - Startup Error</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { user-select: none; -webkit-app-region: drag; overflow: hidden; }
    button, .no-drag { -webkit-app-region: no-drag; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen w-screen flex flex-col p-6">
  <div class="flex items-center gap-3 mb-6">
    <div class="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    </div>
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Startup Failed</h1>
      <p class="text-sm text-gray-500">Billing Optics ERP could not start.</p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 mb-6 flex-1 flex flex-col">
    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Reason</label>
    <div id="error-text" class="text-sm font-medium text-red-600 mb-4 font-mono break-all bg-red-50 p-3 rounded border border-red-100">Unknown Error</div>
    
    <div class="flex gap-4 mt-auto">
      <button id="retryBtn" class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition shadow-md no-drag">Retry Connection</button>
      <button id="logsBtn" class="px-4 py-3 bg-white text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition no-drag">Open Logs</button>
      <button id="resetBtn" class="px-4 py-3 bg-red-50 text-red-600 border border-red-200 rounded-lg font-medium hover:bg-red-100 transition no-drag">Run Setup Again</button>
    </div>
  </div>

  <script src="./startup-error.js"></script>
</body>
</html>
