<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Billing Optics ERP - Recovery Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }
    button, .no-drag {
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen w-screen flex flex-col p-6">
  
  <div class="flex items-center gap-3 mb-6">
    <div class="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
    </div>
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Database Recovery Mode</h1>
      <p class="text-sm text-gray-500">Billing Optics detected a database problem.</p>
    </div>
  </div>

  <div id="issue-container" class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 mb-6 flex-1 relative">
    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Detected Issue</label>
    <div id="issue-text" class="text-lg font-medium text-gray-800 mb-4">Analyzing...</div>
    
    <div class="flex gap-4 absolute bottom-5 left-5 right-5">
      <button id="repairBtn" class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition shadow-md no-drag disabled:opacity-50 flex items-center justify-center gap-2">
        <span>Repair Automatically</span>
        <div id="repair-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </button>
      <button id="diagnosticsBtn" class="px-4 py-3 bg-white text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition no-drag">
        Advanced Diagnostics
      </button>
    </div>
  </div>

  <div id="logs-container" class="hidden bg-gray-900 rounded-xl p-4 mb-6 flex-1 flex flex-col no-drag">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Repair Logs</span>
    </div>
    <textarea id="log-output" readonly class="flex-1 w-full bg-transparent text-green-400 font-mono text-sm resize-none focus:outline-none"></textarea>
  </div>

  <div id="success-container" class="hidden bg-green-50 rounded-xl border border-green-200 p-6 mb-6 flex-1 text-center flex flex-col justify-center">
    <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
    </div>
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Repair Complete</h2>
    <div class="space-y-1 mb-6 text-sm text-gray-600">
      <p>✓ PostgreSQL Running</p>
      <p>✓ Database Accessible</p>
      <p>✓ Backend Ready</p>
    </div>
    <button id="restartBtn" class="w-full px-4 py-3 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700 transition shadow-md no-drag">
      Start Billing Optics
    </button>
  </div>

  <script src="./recovery.js"></script>
</body>
</html>
