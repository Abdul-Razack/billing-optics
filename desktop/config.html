<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Setup Billing Optics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      user-select: none;
      -webkit-app-region: drag;
    }
    input, button {
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen w-screen flex items-center justify-center overflow-hidden">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-600">Initial Setup</h1>
      <p class="text-sm text-gray-500 mt-1">Configure your backend environment</p>
    </div>

    <form id="configForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">PostgreSQL Connection String</label>
        <input 
          type="text" 
          id="dbUrl" 
          name="dbUrl"
          placeholder="postgresql://postgres:password@localhost:5432/billing_optics"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Backend Port</label>
        <input 
          type="number" 
          id="port" 
          name="port"
          value="5000"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
      </div>

      <div class="pt-4 flex justify-end gap-2">
        <button type="button" id="quitBtn" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          Quit
        </button>
        <button type="submit" class="px-4 py-2 bg-blue-600 border border-transparent rounded-md text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 font-medium">
          Save & Continue
        </button>
      </div>
    </form>
  </div>
  <script src="./config.js"></script>
</body>
</html>
