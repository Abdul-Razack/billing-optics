name: Release ERP

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to parse commit history for semantic versioning
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint -w frontend

      - name: Type Check & Build Backend
        run: npm run build:backend

      - name: Run Backend Tests
        run: npm run test -w backend

      - name: Bump Version and Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - name: Sync Version to package.json
        run: |
          npm version ${{ steps.tag_version.outputs.new_version }} --no-git-tag-version -w desktop
          npm version ${{ steps.tag_version.outputs.new_version }} --no-git-tag-version

      - name: Build Frontend
        run: npm run build:frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

      - name: Build and Publish Desktop Installer
        run: npx electron-builder --win --publish always
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Billing-Optics-Installer
          path: desktop/dist/*.exe
          retention-days: 7
