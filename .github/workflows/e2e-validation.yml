name: Ubuntu Validation E2E

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-ubuntu-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Ensure Clean Machine (Purge PostgreSQL)
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get purge -y "postgresql*" || true
          sudo rm -rf /var/lib/postgresql /etc/postgresql

      - name: Build the .deb Package
        run: |
          echo "--- Build Diagnostics ---"
          pwd
          ls -la
          find . -maxdepth 3
          echo "-------------------------"
          chmod +x ./build_local.sh
          ./build_local.sh

      - name: Install the .deb Package
        run: |
          # Install the local built deb package
          sudo dpkg -i desktop/dist/*.deb || sudo apt-get install -f -y

      - name: Mock pkexec for headless CI
        run: |
          echo '#!/bin/bash' | sudo tee /usr/local/bin/pkexec
          echo 'sudo "$@"' | sudo tee -a /usr/local/bin/pkexec
          sudo chmod +x /usr/local/bin/pkexec

      - name: Setup Playwright for E2E
        run: |
          cd e2e-tests
          npm ci || npm install
          npx playwright install --with-deps

      - name: Run Playwright Tests (xvfb)
        env:
          TEST_PG_USER: ci_admin
          TEST_PG_PASS: ci_secure_pass123
        run: |
          cd e2e-tests
          xvfb-run -a npx playwright test tests/ubuntu-deb.spec.js

      - name: Upload Logs and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-validation-evidence
          path: |
            e2e-tests/screenshots/
            e2e-tests/playwright-report/
