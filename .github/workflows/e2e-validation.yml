name: Ubuntu Validation E2E

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-ubuntu-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Ensure Clean Machine (Purge PostgreSQL)
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get purge -y "postgresql*" || true
          sudo rm -rf /var/lib/postgresql /etc/postgresql

      - name: Build the .deb Package
        run: |
          echo "--- Build Diagnostics ---"
          pwd
          ls -la
          find . -maxdepth 3
          echo "-------------------------"
          chmod +x ./build_local.sh
          ./build_local.sh

      - name: Install the .deb Package
        run: |
          # Install the local built deb package
          sudo dpkg -i desktop/dist/*.deb || sudo apt-get install -f -y

      - name: Mock pkexec for headless CI
        run: |
          echo '#!/bin/bash' | sudo tee /usr/local/bin/pkexec
          echo 'sudo "$@"' | sudo tee -a /usr/local/bin/pkexec
          sudo chmod +x /usr/local/bin/pkexec

      - name: Setup Playwright for E2E
        run: |
          cd e2e-tests
          npm ci || npm install
          npx playwright install --with-deps

      - name: Install Desktop Environment Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-0

      - name: Validate and Run Playwright Tests (xvfb + dbus)
        env:
          TEST_PG_USER: ci_admin
          TEST_PG_PASS: ci_secure_pass123
        run: |
          cd e2e-tests
          mkdir -p scripts screenshots
          cat << 'EOF' > scripts/validate-safestorage.js
          const { app, safeStorage } = require('electron');
          const fs = require('fs');
          app.whenReady().then(() => {
            const isAvailable = safeStorage.isEncryptionAvailable();
            const logLine = `DBUS_SESSION_BUS_ADDRESS=${process.env.DBUS_SESSION_BUS_ADDRESS}\nsafeStorage.isEncryptionAvailable()=${isAvailable}\n`;
            fs.writeFileSync('screenshots/safestorage-diagnostic.txt', logLine);
            console.log(logLine);
            if (!isAvailable) {
              console.error('FATAL: Encryption unavailable in CI!');
              process.exit(1);
            }
            console.log('Success: CI Environment behaves like Ubuntu Desktop.');
            process.exit(0);
          }).catch(err => {
            console.error('Electron validation error:', err);
            process.exit(1);
          });
          EOF

          dbus-run-session -- sh -c "
            echo '--- Bootstrapping GNOME Keyring ---'
            eval \$(echo -n 'dummy-password' | gnome-keyring-daemon --daemonize --login)
            export DBUS_SESSION_BUS_ADDRESS
            
            echo '--- Validating Electron safeStorage ---'
            # Using exact version from desktop/package.json
            xvfb-run -a npx -y electron@31.0.0 --no-sandbox scripts/validate-safestorage.js
            
            echo '--- Running Playwright E2E Tests ---'
            xvfb-run -a npx playwright test tests/ubuntu-deb.spec.js
            
            echo '--- Dumping Config Directory ---'
            find ~/.config -maxdepth 3 -type f > screenshots/config-folder-dump.txt || true
          "

      - name: Upload Logs and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-validation-evidence
          path: |
            e2e-tests/screenshots/
            e2e-tests/playwright-report/
            ~/.config/Billing Optics ERP/logs/
            ~/.config/Billing Optics ERP/crash.log
            ~/.config/Billing Optics ERP/rejection.log
